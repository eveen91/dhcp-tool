ddns-update-style none;

subnet 192.0.2.0 netmask 255.255.255.0 {
  default-lease-time 43200;
  max-lease-time 86400;
  option domain-name-servers 8.8.8.8;
  option host-name = pick(option host-name,
    concat("dhcp-", binary-to-ascii(10, 8, "-", leased-address)));
  option routers 192.0.2.1;
  range 192.0.2.10 192.0.2.120;
}

subnet 198.51.100.0 netmask 255.255.255.0 {
  range 198.51.100.100 198.51.100.150;
}

host printer {
  hardware ethernet 02:00:00:00:00:01;
  fixed-address 192.0.2.200;
}

host server {
  hardware ethernet 02:00:00:00:00:02;
  fixed-address 198.51.100.20;
}
