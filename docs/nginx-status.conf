# Temporary, read-only status preview for the local network.
# Install as /etc/nginx/conf.d/dhcp-tool-status.conf, then nginx -t and reload.
server {
    listen 192.168.1.32:8080;
    server_name 192.168.1.32;

    allow 127.0.0.1;
    allow 192.168.1.0/24;
    deny all;

    server_tokens off;
    client_max_body_size 1k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /api/v1/health/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 400 500 502 503 504 =503 @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"status":"unavailable"}';
    }

    location /api/ { return 404; }

    location = / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_cache off;
    }

    location /_next/static/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location / { return 404; }
}
