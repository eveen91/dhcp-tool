# Full panel proxy template for a trusted LAN/VPN. Not installed by tests.
# Production HTTPS, host names and service paths are configured in stage 10.
# Avoid logging URLs, query parameters, request bodies, cookies or upstream errors.
log_format dhcp_safe '$request_method $status $request_time';
server {
    listen 127.0.0.1:8081;
    server_name localhost 127.0.0.1;
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    send_timeout 15s;
    access_log /var/log/nginx/dhcp-tool-access.log dhcp_safe;
    error_log /dev/null;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 10s;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        error_page 502 503 504 =503 @api_unavailable;
    }
    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"upstream_unavailable","message":"API jest chwilowo niedostępne. Ponów odczyt; nie ponawiaj zapisu bez sprawdzenia jego wyniku.","fields":{}}}';
    }
    location /api/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
    }
}
